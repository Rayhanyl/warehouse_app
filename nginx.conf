server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression untuk performa loading SPA
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        # Fallback routing React Router SPA ke index.html
        try_files $uri $uri/ /index.html;
    }

    # Cache control untuk aset statis bervalidasi hash Vite
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Nonaktifkan cache untuk index.html agar rilis versi baru langsung terdeteksi klien
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
